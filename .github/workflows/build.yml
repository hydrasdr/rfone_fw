name: Build HydraSDR RFOne Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      host_version: ${{ steps.host_tools.outputs.host_version }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0
    
    - name: Cache GCC ARM toolchain
      uses: actions/cache@v6
      id: cache-gcc-arm
      with:
        path: ~/gcc-arm-none-eabi-4_7-2013q3
        key: gcc-arm-none-eabi-4_7-2013q3-ubuntu-24.04
    
    - name: Install system dependencies
      run: |
        echo "Checking pre-installed packages..."
        MISSING_PACKAGES=""
        
        for pkg in gcc-multilib git dfu-util python3 python3-pip zip unzip curl jq; do
          if ! dpkg -l | grep -q "^ii  $pkg "; then
            MISSING_PACKAGES="$MISSING_PACKAGES $pkg"
          else
            echo "[OK] $pkg already installed"
          fi
        done
        
        if [ -n "$MISSING_PACKAGES" ]; then
          echo "Installing missing packages:$MISSING_PACKAGES"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends $MISSING_PACKAGES
        else
          echo "All required packages already installed"
        fi
    
    - name: Download and setup GCC ARM toolchain
      if: steps.cache-gcc-arm.outputs.cache-hit != 'true'
      run: |
        cd ~
        wget https://launchpad.net/gcc-arm-embedded/4.7/4.7-2013-q3-update/+download/gcc-arm-none-eabi-4_7-2013q3-20130916-linux.tar.bz2
        tar xjf gcc-arm-none-eabi-4_7-2013q3-20130916-linux.tar.bz2
    
    - name: Setup GCC ARM toolchain in PATH
      run: |
        echo "$HOME/gcc-arm-none-eabi-4_7-2013q3/bin" >> $GITHUB_PATH
    
    - name: Install Python dependencies
      run: |
        cd ./scripts
        python3 -m pip install --upgrade pip
        python3 -m pip install GitPython --upgrade
    
    - name: Verify toolchain installation
      run: |
        arm-none-eabi-gcc --version
        which arm-none-eabi-gcc
    
    - name: Build libopencm3
      run: |
        cd ./libopencm3
        make clean
        make -j$(nproc)
        sudo make install
    
    - name: Build firmware
      run: |
        make clean
        make -j$(nproc)
    
    - name: Extract firmware version
      run: |
        VERSION=$(grep '#define HYDRASDR_FW_GIT_TAG' m0/m0.hdr | sed 's/.*"\([^"]*\)".*/\1/')
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "Firmware version: $VERSION"
    
    - name: Download hydrasdr-host release assets
      run: |
        echo "Downloading HydraSDR Host Tools..."
        
        if ! RELEASE_INFO=$(curl -sSL https://api.github.com/repos/hydrasdr/hydrasdr-host/releases/latest); then
          echo "[ERROR] Failed to fetch release info from GitHub API"
          echo "HYDRASDR_HOST_VERSION=none" >> $GITHUB_ENV
          echo "HYDRASDR_HOST_AVAILABLE=false" >> $GITHUB_ENV
          exit 0
        fi
        
        if echo "$RELEASE_INFO" | jq . >/dev/null 2>&1; then
          HOST_VERSION=$(echo "$RELEASE_INFO" | jq -r '.tag_name // "none"')
        else
          echo "[ERROR] Invalid API response"
          HOST_VERSION="none"
        fi
        
        if [ "$HOST_VERSION" = "none" ] || [ "$HOST_VERSION" = "null" ] || [ -z "$HOST_VERSION" ]; then
          echo "[ERROR] No valid hydrasdr-host release found"
          echo "HYDRASDR_HOST_VERSION=none" >> $GITHUB_ENV
          echo "HYDRASDR_HOST_AVAILABLE=false" >> $GITHUB_ENV
          exit 0
        fi
        
        echo "[OK] Found hydrasdr-host release: $HOST_VERSION"
        echo "HYDRASDR_HOST_VERSION=$HOST_VERSION" >> $GITHUB_ENV
        
        # Filter for both .zip and .tar.gz assets
        echo "$RELEASE_INFO" | jq -r '.assets[] | select(.name | test("\\.(zip|tar\\.gz)$")) | .name' > available_assets.txt
        
        if [ ! -s available_assets.txt ]; then
          echo "[ERROR] No assets found in release"
          echo "HYDRASDR_HOST_AVAILABLE=false" >> $GITHUB_ENV
          exit 0
        fi
        
        echo "Available assets:"
        cat available_assets.txt
        
        mkdir -p hydrasdr_host_binaries
        cd hydrasdr_host_binaries
        
        DOWNLOADED_ASSETS=0
        
        while IFS= read -r asset; do
          if [ -z "$asset" ]; then
            continue
          fi

          # Linux ARM64 assets match the same name patterns as the x64 ones
          # and are written to the same file, so the last one downloaded would
          # win. This package ships x64 tools on Linux.
          if [[ "$asset" =~ ARM64 ]] && [[ "$asset" =~ [Uu]buntu|[Ll]inux ]]; then
            echo "Skipping Linux ARM64 asset: $asset"
            continue
          fi

          # ARM64EC exists to mix x64 and ARM64 code inside one process, which a
          # standalone flashing tool never needs.
          if [[ "$asset" =~ ARM64EC ]]; then
            echo "Skipping ARM64EC asset: $asset"
            continue
          fi
          
          download_url="https://github.com/hydrasdr/hydrasdr-host/releases/download/$HOST_VERSION/$asset"
          echo "Processing: $asset"
          
          if [[ "$asset" =~ [Ww]indows.*ARM64 ]]; then
            if curl -f -L -o "windows-arm64.zip" "$download_url"; then
              echo "[OK] Windows ARM64 tools downloaded"
              DOWNLOADED_ASSETS=$((DOWNLOADED_ASSETS + 1))
            fi

          elif [[ "$asset" =~ [Ww]indows ]] || [[ "$asset" =~ [Ww]in32 ]] || [[ "$asset" =~ [Ww]in64 ]]; then
            if curl -f -L -o "windows-x64.zip" "$download_url"; then
              echo "[OK] Windows x64 tools downloaded"
              DOWNLOADED_ASSETS=$((DOWNLOADED_ASSETS + 1))
            fi
            
          elif [[ "$asset" =~ [Mm]acOS.*x86_64 ]]; then
             if curl -f -L -o "macos-x64.tar.gz" "$download_url"; then
              echo "[OK] macOS x64 tools downloaded"
              DOWNLOADED_ASSETS=$((DOWNLOADED_ASSETS + 1))
            fi

          elif [[ "$asset" =~ [Mm]acOS.*ARM64 ]]; then
             if curl -f -L -o "macos-arm64.tar.gz" "$download_url"; then
              echo "[OK] macOS ARM64 tools downloaded"
              DOWNLOADED_ASSETS=$((DOWNLOADED_ASSETS + 1))
            fi

          elif [[ "$asset" =~ [Uu]buntu.*22 ]] || [[ "$asset" =~ 22\.04 ]]; then
            if curl -f -L -o "ubuntu-22.zip" "$download_url"; then
              echo "[OK] Ubuntu 22.04 tools downloaded"
              DOWNLOADED_ASSETS=$((DOWNLOADED_ASSETS + 1))
            fi
            
          elif [[ "$asset" =~ [Uu]buntu.*24 ]] || [[ "$asset" =~ 24\.04 ]]; then
            if curl -f -L -o "ubuntu-24.zip" "$download_url"; then
              echo "[OK] Ubuntu 24.04 tools downloaded"
              DOWNLOADED_ASSETS=$((DOWNLOADED_ASSETS + 1))
            fi
            
          elif [[ "$asset" =~ [Ll]inux ]] && [[ ! "$asset" =~ [Uu]buntu ]]; then
            if curl -f -L -o "linux.zip" "$download_url"; then
              echo "[OK] Generic Linux tools downloaded"
              DOWNLOADED_ASSETS=$((DOWNLOADED_ASSETS + 1))
            fi
          fi
        done < ../available_assets.txt
        
        echo "Extracting downloaded tools..."
        EXTRACTED_PLATFORMS=0
        
        # Extract Zips
        for zipfile in *.zip; do
          if [ -f "$zipfile" ]; then
            dirname="${zipfile%.zip}"
            if unzip -q "$zipfile" -d "$dirname/"; then
              if find "$dirname" -name "*spiflash*" -type f | head -1 > /dev/null; then
                echo "[OK] Extracted $dirname with spiflash binary"
                EXTRACTED_PLATFORMS=$((EXTRACTED_PLATFORMS + 1))
              fi
            fi
          fi
        done

        # Extract Tarballs (macOS tools are typically .tar.gz)
        for tarfile in *.tar.gz; do
          if [ -f "$tarfile" ]; then
            dirname="${tarfile%.tar.gz}"
            mkdir -p "$dirname"
            if tar -xzf "$tarfile" -C "$dirname"; then
               # Flatten structure if nested
               find "$dirname" -name "hydrasdr_spiflash" -type f -exec cp {} "$dirname/" \;
               
               if [ -f "$dirname/hydrasdr_spiflash" ]; then
                 echo "[OK] Extracted $dirname with spiflash binary"
                 EXTRACTED_PLATFORMS=$((EXTRACTED_PLATFORMS + 1))
               fi
            fi
          fi
        done
        
        # Create fallback mappings for missing distributions
        if [ ! -d "ubuntu-22" ] && [ -d "linux" ]; then
          cp -r linux ubuntu-22
          echo "[OK] Using generic linux tools for Ubuntu 22.04"
          EXTRACTED_PLATFORMS=$((EXTRACTED_PLATFORMS + 1))
        fi
        
        if [ ! -d "ubuntu-24" ] && [ -d "linux" ]; then
          cp -r linux ubuntu-24  
          echo "[OK] Using generic linux tools for Ubuntu 24.04"
          EXTRACTED_PLATFORMS=$((EXTRACTED_PLATFORMS + 1))
        fi
        
        # Neither actions/upload-artifact nor .zip preserves the execute bit,
        # so the tools arrive as 0644 and cannot be run from the package.
        find . -maxdepth 2 -type f \( -name 'hydrasdr_*' -o -name '*.dylib' \
          -o -name '*.so*' -o -name '*.exe' -o -name '*.dll' \) -exec chmod 755 {} +

        if [ $EXTRACTED_PLATFORMS -gt 0 ]; then
          echo "[OK] Successfully extracted $EXTRACTED_PLATFORMS platform(s)"
          echo "HYDRASDR_HOST_AVAILABLE=true" >> $GITHUB_ENV
        else
          echo "[ERROR] No host tools successfully extracted"
          echo "HYDRASDR_HOST_AVAILABLE=false" >> $GITHUB_ENV
        fi
    
    - name: Export host tools version
      id: host_tools
      run: echo "host_version=${HYDRASDR_HOST_VERSION:-none}" >> $GITHUB_OUTPUT

    - name: Create package
      run: |
        PACKAGE_DIR="hydrasdr-rfone-firmware-${{ env.VERSION }}"
        mkdir -p "$PACKAGE_DIR"
        
        echo "Creating package: $PACKAGE_DIR"
        
        # Include firmware
        if [ -f "fw_bin/hydrasdr_rfone_fw.bin" ]; then
          cp fw_bin/hydrasdr_rfone_fw.bin "$PACKAGE_DIR/"
          echo "[OK] Firmware binary included"
        else
          echo "[ERROR] ERROR: Firmware binary not found!"
          exit 1
        fi
        
        # Include DFU tools if available
        if [ -d "fw_bin/dfuprog_hydrasdr" ]; then
          cp -r fw_bin/dfuprog_hydrasdr "$PACKAGE_DIR/"
          echo "[OK] DFU tools included"
        fi
        
        # Include platform-specific host tools
        INCLUDED_PLATFORMS=""
        
        if [ -d "hydrasdr_host_binaries/windows-x64" ]; then
          cp -r hydrasdr_host_binaries/windows-x64 "$PACKAGE_DIR/"
          echo "[OK] Windows x64 host tools included"
          INCLUDED_PLATFORMS="$INCLUDED_PLATFORMS windows-x64"
        fi

        if [ -d "hydrasdr_host_binaries/windows-arm64" ]; then
          cp -r hydrasdr_host_binaries/windows-arm64 "$PACKAGE_DIR/"
          echo "[OK] Windows ARM64 host tools included"
          INCLUDED_PLATFORMS="$INCLUDED_PLATFORMS windows-arm64"
        fi
        
        if [ -d "hydrasdr_host_binaries/macos-x64" ]; then
          cp -r hydrasdr_host_binaries/macos-x64 "$PACKAGE_DIR/"
          echo "[OK] macOS x64 host tools included"
          INCLUDED_PLATFORMS="$INCLUDED_PLATFORMS macos-x64"
        fi

        if [ -d "hydrasdr_host_binaries/macos-arm64" ]; then
          cp -r hydrasdr_host_binaries/macos-arm64 "$PACKAGE_DIR/"
          echo "[OK] macOS ARM64 host tools included"
          INCLUDED_PLATFORMS="$INCLUDED_PLATFORMS macos-arm64"
        fi
        
        if [ -d "hydrasdr_host_binaries/ubuntu-22" ]; then
          cp -r hydrasdr_host_binaries/ubuntu-22 "$PACKAGE_DIR/"
          echo "[OK] Ubuntu 22.04 host tools included"
          INCLUDED_PLATFORMS="$INCLUDED_PLATFORMS ubuntu-22"
        fi
        
        if [ -d "hydrasdr_host_binaries/ubuntu-24" ]; then
          cp -r hydrasdr_host_binaries/ubuntu-24 "$PACKAGE_DIR/"
          echo "[OK] Ubuntu 24.04 host tools included"
          INCLUDED_PLATFORMS="$INCLUDED_PLATFORMS ubuntu-24"
        fi
        
        # Set environment variables for later steps
        if [ -n "$INCLUDED_PLATFORMS" ]; then
          echo "HOST_TOOLS_INCLUDED=true" >> $GITHUB_ENV
          echo "INCLUDED_PLATFORMS=$INCLUDED_PLATFORMS" >> $GITHUB_ENV
          echo "[OK] Host tools included for:$INCLUDED_PLATFORMS"
        else
          echo "HOST_TOOLS_INCLUDED=false" >> $GITHUB_ENV
          echo "INCLUDED_PLATFORMS=" >> $GITHUB_ENV
          echo "[WARN] No host tools included - firmware-only package"
        fi
    
    - name: Create flash scripts
      run: |
        PACKAGE_DIR="hydrasdr-rfone-firmware-${{ env.VERSION }}"
        
        # Windows flash script
        cat > "$PACKAGE_DIR/flash_firmware_windows.bat" << 'WINEOF'
        @echo off
        echo HydraSDR RFOne Firmware Flash Tool
        echo ===================================
        echo.
        echo Prerequisites:
        echo - HydraSDR RFOne connected via USB
        echo - Device in normal operation mode (not DFU mode)
        echo.
        
        rem PROCESSOR_ARCHITEW6432 is set when this .bat runs under x64 emulation
        rem on an ARM64 machine, PROCESSOR_ARCHITECTURE when it runs natively.
        set "TOOLDIR=windows-x64"
        if /I "%PROCESSOR_ARCHITECTURE%"=="ARM64" set "TOOLDIR=windows-arm64"
        if /I "%PROCESSOR_ARCHITEW6432%"=="ARM64" set "TOOLDIR=windows-arm64"
        rem fall back to the x64 tools, which also run on ARM64 under emulation
        if not exist "%TOOLDIR%\hydrasdr_spiflash.exe" set "TOOLDIR=windows-x64"

        if exist "%TOOLDIR%\hydrasdr_spiflash.exe" (
            echo Host tools found in %TOOLDIR% - ready to flash
            echo.
            pause
            echo Flashing firmware...
            "%TOOLDIR%\hydrasdr_spiflash.exe" -w hydrasdr_rfone_fw.bin
            if errorlevel 1 (
                echo Flash failed!
            ) else (
                echo Flash successful!
                if exist "%TOOLDIR%\hydrasdr_reset.exe" (
                    "%TOOLDIR%\hydrasdr_reset.exe"
                )
            )
        ) else (
            echo Host tools not included in this package.
            echo Please download from: https://github.com/hydrasdr/hydrasdr-host
            echo Then use: hydrasdr_spiflash.exe -w hydrasdr_rfone_fw.bin
        )
        pause
        WINEOF

        # macOS flash script
        cat > "$PACKAGE_DIR/flash_firmware_macos.sh" << 'MACOSEOF'
        #!/bin/bash
        echo "HydraSDR RFOne Firmware Flash Tool (macOS)"
        echo "=========================================="
        
        ARCH=$(uname -m)
        TOOL=""

        if [ "$ARCH" == "arm64" ]; then
            if [ -d "macos-arm64" ]; then
                TOOL="macos-arm64/hydrasdr_spiflash"
                echo "Detected Apple Silicon (ARM64). Using: $TOOL"
            fi
        else
            if [ -d "macos-x64" ]; then
                TOOL="macos-x64/hydrasdr_spiflash"
                echo "Detected Intel Mac (x86_64). Using: $TOOL"
            fi
        fi

        if [ -z "$TOOL" ]; then
             echo "Could not find tools for $ARCH inside the package."
             echo "Please check the 'macos-x64' or 'macos-arm64' folders."
             exit 1
        fi

        # Fix Gatekeeper quarantine attribute on the tools and the bundled dylibs
        echo "Removing Gatekeeper quarantine flag (if any)..."
        xattr -dr com.apple.quarantine "$(dirname "$TOOL")" 2>/dev/null

        chmod +x "$TOOL"
        echo "Flashing firmware..."
        ./"$TOOL" -w hydrasdr_rfone_fw.bin

        if [ $? -eq 0 ]; then
             echo "Flash successful!"
             # Try reset if available
             RESET_TOOL="${TOOL/_spiflash/_reset}"
             if [ -f "$RESET_TOOL" ]; then
                 chmod +x "$RESET_TOOL"
                 ./"$RESET_TOOL"
                 echo "Device reset."
             fi
        else
             echo "Flash failed."
        fi
        MACOSEOF
        chmod +x "$PACKAGE_DIR/flash_firmware_macos.sh"

        # Linux flash script
        cat > "$PACKAGE_DIR/flash_firmware_linux.sh" << 'LINEOF'
        #!/bin/bash
        echo "HydraSDR RFOne Firmware Flash Tool"
        echo "=================================="
        echo
        echo "Prerequisites:"
        echo "- HydraSDR RFOne connected via USB"
        echo "- Device in normal operation mode (not DFU mode)"
        echo "- Appropriate USB permissions (may need sudo)"
        echo

        # Determine which Ubuntu version tools to use
        BINARY_DIR=""
        if [ -f /etc/os-release ]; then
            . /etc/os-release
            echo "Detected OS: $NAME $VERSION_ID"
            case "$VERSION_ID" in
                "22.04") 
                    if [ -d "ubuntu-22" ]; then
                        BINARY_DIR="ubuntu-22"
                        echo "Using ubuntu-22 tools for Ubuntu 22.04"
                    fi
                    ;;
                "24.04") 
                    if [ -d "ubuntu-24" ]; then
                        BINARY_DIR="ubuntu-24"
                        echo "Using ubuntu-24 tools for Ubuntu 24.04"
                    fi
                    ;;
            esac
        fi

        # Fallback to newest available tools
        if [ -z "$BINARY_DIR" ]; then
            if [ -d "ubuntu-24" ]; then
                BINARY_DIR="ubuntu-24"
                echo "Using ubuntu-24 tools as fallback"
            elif [ -d "ubuntu-22" ]; then
                BINARY_DIR="ubuntu-22"
                echo "Using ubuntu-22 tools as fallback"
            fi
        fi

        if [ -n "$BINARY_DIR" ] && [ -f "$BINARY_DIR/hydrasdr_spiflash" ]; then
            echo "Host tools found in $BINARY_DIR - ready to flash"
            echo
            read -p "Press Enter to continue..."
            echo "Flashing firmware..."
            chmod +x "$BINARY_DIR/hydrasdr_spiflash"
            # The tools load the bundled libhydrasdr.so from their own directory
            export LD_LIBRARY_PATH="$PWD/$BINARY_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            ./"$BINARY_DIR/hydrasdr_spiflash" -w hydrasdr_rfone_fw.bin
            if [ $? -eq 0 ]; then
                echo "Flash successful!"
                if [ -f "$BINARY_DIR/hydrasdr_reset" ]; then
                    chmod +x "$BINARY_DIR/hydrasdr_reset"
                    ./"$BINARY_DIR/hydrasdr_reset"
                    echo "Device reset!"
                fi
            else
                echo "Flash failed!"
                echo "Try running with sudo if you get permission errors."
            fi
        else
            echo "Host tools not included in this package."
            echo "Available tools should be downloaded from:"
            echo "https://github.com/hydrasdr/hydrasdr-host/releases"
            echo
            echo "Manual flash command:"
            echo "  ./hydrasdr_spiflash -w hydrasdr_rfone_fw.bin"
        fi
        LINEOF
        
        chmod +x "$PACKAGE_DIR/flash_firmware_linux.sh"
    
    - name: Create README
      run: |
        PACKAGE_DIR="hydrasdr-rfone-firmware-${{ env.VERSION }}"
        
        # Check what platforms are actually included and build manual section
        MANUAL_SECTION=""
        if [ -d "$PACKAGE_DIR/windows-x64" ] || [ -d "$PACKAGE_DIR/windows-arm64" ] || [ -d "$PACKAGE_DIR/ubuntu-22" ] || [ -d "$PACKAGE_DIR/macos-x64" ]; then
          MANUAL_SECTION="## Manual Flashing

        Host tools are included for:"
          
          if [ -d "$PACKAGE_DIR/windows-x64" ]; then
            MANUAL_SECTION="$MANUAL_SECTION
        - Windows (x64): \`windows-x64\\\\hydrasdr_spiflash.exe -w hydrasdr_rfone_fw.bin\`"
          fi

          if [ -d "$PACKAGE_DIR/windows-arm64" ]; then
            MANUAL_SECTION="$MANUAL_SECTION
        - Windows (ARM64): \`windows-arm64\\\\hydrasdr_spiflash.exe -w hydrasdr_rfone_fw.bin\`"
          fi

          if [ -d "$PACKAGE_DIR/macos-x64" ]; then
             MANUAL_SECTION="$MANUAL_SECTION
        - macOS (Intel): \`./macos-x64/hydrasdr_spiflash -w hydrasdr_rfone_fw.bin\`"
          fi
          
          if [ -d "$PACKAGE_DIR/macos-arm64" ]; then
             MANUAL_SECTION="$MANUAL_SECTION
        - macOS (Apple Silicon): \`./macos-arm64/hydrasdr_spiflash -w hydrasdr_rfone_fw.bin\`"
          fi
          
          if [ -d "$PACKAGE_DIR/ubuntu-22" ]; then
            MANUAL_SECTION="$MANUAL_SECTION
        - Ubuntu 22.04: \`./ubuntu-22/hydrasdr_spiflash -w hydrasdr_rfone_fw.bin\`"
          fi
          
          if [ -d "$PACKAGE_DIR/ubuntu-24" ]; then
            MANUAL_SECTION="$MANUAL_SECTION
        - Ubuntu 24.04: \`./ubuntu-24/hydrasdr_spiflash -w hydrasdr_rfone_fw.bin\`"
          fi
        else
          MANUAL_SECTION="## Manual Flashing

        [WARN] **Host tools not included in this package**

        Download host tools from: https://github.com/hydrasdr/hydrasdr-host/releases
        Then use: \`./hydrasdr_spiflash -w hydrasdr_rfone_fw.bin\`"
        fi
        
        cat > "$PACKAGE_DIR/README.md" << READMEEOF
        # HydraSDR RFOne Firmware ${{ env.VERSION }}

        ## Quick Start

        ### Windows
        Double-click \`flash_firmware_windows.bat\`

        ### macOS
        Run \`./flash_firmware_macos.sh\` (auto-detects Architecture and fixes Gatekeeper)

        ### Linux  
        Run \`./flash_firmware_linux.sh\` (auto-detects Ubuntu version)

        $MANUAL_SECTION

        ## Prerequisites
        - HydraSDR RFOne connected via USB
        - Device in normal operation mode (not DFU mode)
        - On Linux: appropriate USB permissions (may need sudo)

        ## Resources
        - Firmware: https://github.com/hydrasdr/rfone_fw
        - Host Tools: https://github.com/hydrasdr/hydrasdr-host
        - Host Tools Flash Documentation: https://github.com/hydrasdr/hydrasdr-host/blob/main/hydrasdr-tools/hydrasdr_tools_readme.md#hydrasdr_spiflash
        - Required Host Tools: https://github.com/hydrasdr/hydrasdr-host/releases $HYDRASDR_HOST_VERSION or more
        - Website: https://hydrasdr.com
        READMEEOF
    
    - name: Create archives
      run: |
        PACKAGE_DIR="hydrasdr-rfone-firmware-${{ env.VERSION }}"
        
        echo "Creating archives..."
        
        # Create complete archive with all platforms (without extra directory level)
        cd "$PACKAGE_DIR"
        zip -r "../hydrasdr-rfone-firmware-${{ env.VERSION }}-complete.zip" .
        cd ..
        echo "[OK] Created complete archive"
        
        # Create platform-specific archives if host tools are included
        if [ "${{ env.HOST_TOOLS_INCLUDED }}" = "true" ]; then
          
          # Windows archives, one per architecture
          for WIN_ARCH in x64 arm64; do
            if [[ "${{ env.INCLUDED_PLATFORMS }}" != *"windows-$WIN_ARCH"* ]]; then
              continue
            fi
            REL_DIR="windows-$WIN_ARCH-release"
            mkdir -p "$REL_DIR"
            cp "$PACKAGE_DIR/hydrasdr_rfone_fw.bin" "$REL_DIR/"
            cp "$PACKAGE_DIR/flash_firmware_windows.bat" "$REL_DIR/"
            cp "$PACKAGE_DIR/README.md" "$REL_DIR/"
            cp -r "$PACKAGE_DIR/windows-$WIN_ARCH" "$REL_DIR/"
            if [ -d "$PACKAGE_DIR/dfuprog_hydrasdr" ]; then
              cp -r "$PACKAGE_DIR/dfuprog_hydrasdr" "$REL_DIR/"
            fi

            cd "$REL_DIR"
            zip -r "../hydrasdr-rfone-firmware-${{ env.VERSION }}-windows-$WIN_ARCH.zip" .
            cd ..
            echo "[OK] Created Windows $WIN_ARCH archive"
          done
          
          # macOS x64 archive
          if [[ "${{ env.INCLUDED_PLATFORMS }}" == *"macos-x64"* ]]; then
            mkdir -p "macos-x64-release"
            cp "$PACKAGE_DIR/hydrasdr_rfone_fw.bin" "macos-x64-release/"
            cp "$PACKAGE_DIR/flash_firmware_macos.sh" "macos-x64-release/"
            cp "$PACKAGE_DIR/README.md" "macos-x64-release/"
            cp -r "$PACKAGE_DIR/macos-x64" "macos-x64-release/"
            
            tar -czf "hydrasdr-rfone-firmware-${{ env.VERSION }}-macos-x64.tar.gz" -C "macos-x64-release" .
            echo "[OK] Created macOS x64 archive"
          fi

          # macOS ARM64 archive
          if [[ "${{ env.INCLUDED_PLATFORMS }}" == *"macos-arm64"* ]]; then
            mkdir -p "macos-arm64-release"
            cp "$PACKAGE_DIR/hydrasdr_rfone_fw.bin" "macos-arm64-release/"
            cp "$PACKAGE_DIR/flash_firmware_macos.sh" "macos-arm64-release/"
            cp "$PACKAGE_DIR/README.md" "macos-arm64-release/"
            cp -r "$PACKAGE_DIR/macos-arm64" "macos-arm64-release/"
            
            tar -czf "hydrasdr-rfone-firmware-${{ env.VERSION }}-macos-arm64.tar.gz" -C "macos-arm64-release" .
            echo "[OK] Created macOS ARM64 archive"
          fi

          # Ubuntu 22.04 archive
          if [[ "${{ env.INCLUDED_PLATFORMS }}" == *"ubuntu-22"* ]]; then
            mkdir -p "ubuntu-22-release"
            cp "$PACKAGE_DIR/hydrasdr_rfone_fw.bin" "ubuntu-22-release/"
            cp "$PACKAGE_DIR/flash_firmware_linux.sh" "ubuntu-22-release/"
            cp "$PACKAGE_DIR/README.md" "ubuntu-22-release/"
            cp -r "$PACKAGE_DIR/ubuntu-22" "ubuntu-22-release/"
            
            tar -czf "hydrasdr-rfone-firmware-${{ env.VERSION }}-ubuntu-22.04.tar.gz" -C "ubuntu-22-release" .
            echo "[OK] Created Ubuntu 22.04 archive"
          fi
          
          # Ubuntu 24.04 archive
          if [[ "${{ env.INCLUDED_PLATFORMS }}" == *"ubuntu-24"* ]]; then
            mkdir -p "ubuntu-24-release"
            cp "$PACKAGE_DIR/hydrasdr_rfone_fw.bin" "ubuntu-24-release/"
            cp "$PACKAGE_DIR/flash_firmware_linux.sh" "ubuntu-24-release/"
            cp "$PACKAGE_DIR/README.md" "ubuntu-24-release/"
            cp -r "$PACKAGE_DIR/ubuntu-24" "ubuntu-24-release/"
            
            tar -czf "hydrasdr-rfone-firmware-${{ env.VERSION }}-ubuntu-24.04.tar.gz" -C "ubuntu-24-release" .
            echo "[OK] Created Ubuntu 24.04 archive"
          fi
        fi
        
        # Show created archives
        echo "Created archives:"
        ls -la *.zip *.tar.gz 2>/dev/null || echo "No additional archives created"
    
    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v7
      with:
        name: hydrasdr-rfone-firmware-${{ env.VERSION }}
        path: |
          hydrasdr-rfone-firmware-${{ env.VERSION }}/*
          *.zip
          *.tar.gz
        retention-days: 30

  update_nightly_release:
    runs-on: ubuntu-24.04
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    
    - name: Download all build artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: hydrasdr-rfone-firmware-*
        merge-multiple: true
        path: ./artifacts
    
    - name: Extract firmware version
      run: |
        VERSION_FILE=$(find ./artifacts -name "*.zip" | head -1)
        if [ -n "$VERSION_FILE" ]; then
          FULL_VERSION=$(basename "$VERSION_FILE" .zip | sed 's/hydrasdr-rfone-firmware-//')
          # Clean version string to remove platform suffixes if needed
          BASE_VERSION=$(echo "$FULL_VERSION" | sed 's/-complete$//' | sed 's/-windows.*$//' | sed 's/-ubuntu.*$//' | sed 's/-macos.*$//')
          echo "VERSION=$BASE_VERSION" >> $GITHUB_ENV
          echo "Detected version: $BASE_VERSION"
        else
          echo "VERSION=unknown" >> $GITHUB_ENV
        fi
    
    - name: Generate release notes
      run: |
        TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
        COMMIT_SHORT=$(git rev-parse --short HEAD)
        COMMIT_MSG=$(git log -1 --pretty=format:'%s')
        
        cat > release_notes.md << 'NOTEEOF'
        # HydraSDR RFOne Nightly Firmware
        NOTEEOF
        
        echo "" >> release_notes.md
        echo "**Version:** ${{ env.VERSION }}" >> release_notes.md
        echo "**Built:** $TIMESTAMP" >> release_notes.md
        echo "**Commit:** [\`$COMMIT_SHORT\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})" >> release_notes.md
        echo "**Message:** $COMMIT_MSG" >> release_notes.md
        echo "" >> release_notes.md
        HOST_TOOLS_VERSION="${{ needs.build.outputs.host_version }}"
        if [ -n "$HOST_TOOLS_VERSION" ] && [ "$HOST_TOOLS_VERSION" != "none" ]; then
          echo "HydraSDR RFOne Firmware ${{ env.VERSION }} shall be used with HydraSDR Host Tools + Shared Lib / DLL $HOST_TOOLS_VERSION or more, see [hydrasdr-host/releases](https://github.com/hydrasdr/hydrasdr-host/releases)" >> release_notes.md
          echo "" >> release_notes.md
          echo "**Bundled host tools:** $HOST_TOOLS_VERSION" >> release_notes.md
        else
          echo "**Host tools are NOT included in these packages**, download them from [hydrasdr-host/releases](https://github.com/hydrasdr/hydrasdr-host/releases)" >> release_notes.md
        fi
        echo "" >> release_notes.md
        echo "## [WARN] Development Build" >> release_notes.md
        echo "This is an automated nightly build. Use at your own risk!" >> release_notes.md
        echo "" >> release_notes.md
        echo "## Available Downloads" >> release_notes.md
        
        # List available archives
        COMPLETE_ARCHIVE=$(find ./artifacts -name "*-complete.zip" | head -1)
        if [ -n "$COMPLETE_ARCHIVE" ]; then
          COMPLETE_NAME=$(basename "$COMPLETE_ARCHIVE")
          echo "- **$COMPLETE_NAME** - All platforms included (Windows, macOS, Linux)" >> release_notes.md
        fi
        
        WINDOWSX64_ARCHIVE=$(find ./artifacts -name "*-windows-x64.zip" | head -1)
        if [ -n "$WINDOWSX64_ARCHIVE" ]; then
          echo "- **$(basename "$WINDOWSX64_ARCHIVE")** - Windows x64 tools only" >> release_notes.md
        fi

        WINDOWSARM_ARCHIVE=$(find ./artifacts -name "*-windows-arm64.zip" | head -1)
        if [ -n "$WINDOWSARM_ARCHIVE" ]; then
          echo "- **$(basename "$WINDOWSARM_ARCHIVE")** - Windows ARM64 tools only" >> release_notes.md
        fi

        MACOSX64_ARCHIVE=$(find ./artifacts -name "*-macos-x64.tar.gz" | head -1)
        if [ -n "$MACOSX64_ARCHIVE" ]; then
          echo "- **$(basename "$MACOSX64_ARCHIVE")** - macOS Intel tools only" >> release_notes.md
        fi

        MACOSARM_ARCHIVE=$(find ./artifacts -name "*-macos-arm64.tar.gz" | head -1)
        if [ -n "$MACOSARM_ARCHIVE" ]; then
          echo "- **$(basename "$MACOSARM_ARCHIVE")** - macOS Apple Silicon tools only" >> release_notes.md
        fi
        
        UBUNTU22_ARCHIVE=$(find ./artifacts -name "*-ubuntu-22.04.tar.gz" | head -1)
        if [ -n "$UBUNTU22_ARCHIVE" ]; then
          echo "- **$(basename "$UBUNTU22_ARCHIVE")** - Ubuntu 22.04 LTS tools" >> release_notes.md
        fi
        
        UBUNTU24_ARCHIVE=$(find ./artifacts -name "*-ubuntu-24.04.tar.gz" | head -1)
        if [ -n "$UBUNTU24_ARCHIVE" ]; then
          echo "- **$(basename "$UBUNTU24_ARCHIVE")** - Ubuntu 24.04 LTS tools" >> release_notes.md
        fi
        
        cat >> release_notes.md << 'NOTEEOF2'

        ## Quick Flash
        1. Download the appropriate package for your platform
        2. Extract it  
        3. Run the flash script:
           - **Windows**: Double-click `flash_firmware_windows.bat`
           - **macOS**: Run `./flash_firmware_macos.sh`
           - **Linux**: Run `./flash_firmware_linux.sh`

        ## Package Contents
        The complete archive holds every platform, a per platform archive holds only its own tools:
        - `README.md` - this Readme with Quick Start
        - `hydrasdr_rfone_fw.bin` - Main firmware binary
        - `flash_firmware_windows.bat` - Windows flashing script
        - `flash_firmware_macos.sh` - macOS flashing script
        - `flash_firmware_linux.sh` - Linux flashing script
        - `windows-x64/` and `windows-arm64/` - Windows host tools (x64, ARM64)
        - `macos-x64/` and `macos-arm64/` - macOS host tools (Intel, Apple Silicon)
        - `ubuntu-22/` and `ubuntu-24/` - Ubuntu 22.04 and 24.04 host tools
        - `dfuprog_hydrasdr/` - DFU programming tools (Windows only)

        ## Manual Flashing
        - **Windows (x64)**: `.\windows-x64\hydrasdr_spiflash.exe -w .\hydrasdr_rfone_fw.bin`
        - **Windows (ARM64)**: `.\windows-arm64\hydrasdr_spiflash.exe -w .\hydrasdr_rfone_fw.bin`
        - **macOS (Intel)**: `./macos-x64/hydrasdr_spiflash -w ./hydrasdr_rfone_fw.bin`
        - **macOS (Apple Silicon)**: `./macos-arm64/hydrasdr_spiflash -w ./hydrasdr_rfone_fw.bin`
        - **Ubuntu 22.04**: `./ubuntu-22/hydrasdr_spiflash -w ./hydrasdr_rfone_fw.bin`
        - **Ubuntu 24.04**: `./ubuntu-24/hydrasdr_spiflash -w ./hydrasdr_rfone_fw.bin`

        ## Prerequisites
        - HydraSDR RFOne connected via USB
        - Device in normal operation mode (not DFU mode)
        - On Linux: appropriate USB permissions (may need sudo)

        ## Resources
        - [Firmware Repository](https://github.com/hydrasdr/rfone_fw)
        - [Host Tools](https://github.com/hydrasdr/hydrasdr-host)
        - [Host Tools Flash Documentation](https://github.com/hydrasdr/hydrasdr-host/blob/main/hydrasdr-tools/hydrasdr_tools_readme.md#hydrasdr_spiflash)
        - [Website](https://hydrasdr.com)

        Archives generated by GitHub Workflow https://github.com/${{ github.repository }}/blob/main/.github/workflows/build.yml
        NOTEEOF2
    
    - name: Delete and create nightly release
      run: |
        gh release delete nightly -R ${{ github.repository }} --yes || echo "No existing nightly release"
        
        TIMESTAMP=$(date -u '+%Y%m%d-%H%M%S')
        gh release create nightly \
          -R ${{ github.repository }} \
          --title "Nightly Build ($TIMESTAMP)" \
          --notes-file release_notes.md \
          --prerelease
    
    - name: Upload archives to release
      run: |
        echo "Uploading archives to nightly release..."
        
        find ./artifacts -name "*.zip" -exec gh release upload nightly {} -R ${{ github.repository }} \;
        find ./artifacts -name "*.tar.gz" -exec gh release upload nightly {} -R ${{ github.repository }} \;
        
        echo "Upload complete!"
